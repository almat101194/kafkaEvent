services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-demo-broker
    ports:
      - "9092:9092"
    environment:
      # Однонодовый кластер в режиме KRaft (без Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT — для подключения с хоста (ваше Spring Boot приложение), DOCKER — для других контейнеров (kafka-ui)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # По умолчанию для auto-create топиков — 3 партиции, чтобы concurrency=3 в consumer'е (KafkaConfig)
      # реально распределялся по партициям, а не простаивал
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Веб-UI для просмотра топиков и сообщений (необязательно, но удобно для отладки)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-demo-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  postgres:
    image: postgres:16-alpine
    container_name: kafka-demo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: message_event
      POSTGRES_USER: kafka_demo
      POSTGRES_PASSWORD: kafka_demo
    volumes:
      - kafka-demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafka_demo -d message_event"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka-demo-postgres-data:
