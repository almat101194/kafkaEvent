services:
  zookeeper:
    image: bitnamilegacy/zookeeper:3.8
    environment:
      ALLOW_ANONYMOUS_LOGIN: yes
      ZOO_4LW_COMMANDS_WHITELIST: ruok
      JVMFLAGS: -Xms384m -Xmx384m
      TZ: Asia/Novosibirsk
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    healthcheck:
      test: "sh -c 'echo ruok | timeout 2 nc localhost 2181 | grep imok'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: bitnamilegacy/kafka:3.2
    volumes:
      - ./command-config.properties:/opt/bitnami/kafka/config/command-config.properties
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./list-users.sh:/opt/bitnami/kafka/bin/list-users.sh
    environment:
      KAFKA_CFG_LISTENERS: SASL_PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CFG_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND: true
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_CFG_SUPER_USERS: User:kafka
      KAFKA_CLIENT_USERS: kafka
      KAFKA_CLIENT_PASSWORDS: kafka
      KAFKA_INTER_BROKER_USER: kafka
      KAFKA_INTER_BROKER_PASSWORD: kafka
      KAFKA_HEAP_OPTS: -Xms768m -Xmx768m
      TZ: Asia/Novosibirsk
    depends_on:
      zookeeper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024m
    healthcheck:
      test: "list-users.sh | grep equifax-transfer-service"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ets-kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: ets-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: INTERNAL://kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_PROTOCOL: SASL
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka" password="kafka";
      DYNAMIC_CONFIG_ENABLED: true
    links:
      - kafka
      - zookeeper