
app:
  kafka:
    topic: ets.antifraud-event

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    jaas:
      enabled: true
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:equifax-transfer-service}" password="${KAFKA_PASSWORD:equifax-transfer-service}";
